name: iosApp
options:
  bundleIdPrefix: com.segurancarural
  deploymentTarget:
    iOS: "16.0"

configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Pre: debug
  Release-Pre: release
  Debug-Prod: debug
  Release-Prod: release

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [iosApp]
    settings:
      base:
        INFOPLIST_FILE: iosApp/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: "" # To be filled locally by the user
        OTHER_LDFLAGS:
          - -ObjC
      configs:
        Debug-Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.segurancarural.gpstracker.dev
          PRODUCT_NAME: SegurancaRuralDEV
        Release-Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.segurancarural.gpstracker.dev
          PRODUCT_NAME: SegurancaRuralDEV
        Debug-Pre:
          PRODUCT_BUNDLE_IDENTIFIER: com.segurancarural.gpstracker.pre
          PRODUCT_NAME: SegurancaRuralPRE
        Release-Pre:
          PRODUCT_BUNDLE_IDENTIFIER: com.segurancarural.gpstracker.pre
          PRODUCT_NAME: SegurancaRuralPRE
        Debug-Prod:
          PRODUCT_BUNDLE_IDENTIFIER: com.segurancarural.gpstracker
          PRODUCT_NAME: SegurancaRural
        Release-Prod:
          PRODUCT_BUNDLE_IDENTIFIER: com.segurancarural.gpstracker
          PRODUCT_NAME: SegurancaRural
    preBuildScripts:
      - name: Generate Environment Variables
        script: |
          cd "$SRCROOT/.."
          LOCAL_PROPS="local.properties"
          OUT_FILE="iosApp/iosApp/Environment.swift"
          
          # Write Environment.swift
          echo "import Foundation" > "$OUT_FILE"
          echo "struct Environment {" >> "$OUT_FILE"
          
          if [ -f "$LOCAL_PROPS" ]; then
              while IFS='=' read -r key value; do
                  key=$(echo "$key" | tr -d '\r')
                  value=$(echo "$value" | tr -d '\r')
                  if [[ $key == \#* ]] || [[ -z $key ]]; then continue; fi
                  
                  if [ "$key" == "supabase.url" ]; then
                      value=$(echo "$value" | sed 's/\\:/:/g')
                      echo "    static let supabaseUrl = \"$value\"" >> "$OUT_FILE"
                  elif [ "$key" == "supabase.key" ]; then
                      echo "    static let supabaseKey = \"$value\"" >> "$OUT_FILE"
                  elif [ "$key" == "device.api.secret" ]; then
                      echo "    static let deviceApiSecret = \"$value\"" >> "$OUT_FILE"
                  fi
              done < "$LOCAL_PROPS"
          fi
          
          # Resolve backend URL based on configuration
          if [[ "$CONFIGURATION" == *"-Dev"* ]]; then
              backendUrl=$(grep '^backend.base.url.dev=' "$LOCAL_PROPS" 2>/dev/null | cut -d'=' -f2)
              [ -z "$backendUrl" ] && backendUrl=$(grep '^backend.base.url=' "$LOCAL_PROPS" 2>/dev/null | cut -d'=' -f2)
              [ -z "$backendUrl" ] && backendUrl="https://gps-tracker-8q7deewac-gmlourencos-projects.vercel.app/"
          elif [[ "$CONFIGURATION" == *"-Pre"* ]]; then
              backendUrl=$(grep '^backend.base.url.pre=' "$LOCAL_PROPS" 2>/dev/null | cut -d'=' -f2)
              [ -z "$backendUrl" ] && backendUrl=$(grep '^backend.base.url=' "$LOCAL_PROPS" 2>/dev/null | cut -d'=' -f2)
              [ -z "$backendUrl" ] && backendUrl="https://segurancarural-gpstracker-pre.vercel.app"
          else
              backendUrl=$(grep '^backend.base.url.prod=' "$LOCAL_PROPS" 2>/dev/null | cut -d'=' -f2)
              [ -z "$backendUrl" ] && backendUrl=$(grep '^backend.base.url=' "$LOCAL_PROPS" 2>/dev/null | cut -d'=' -f2)
              [ -z "$backendUrl" ] && backendUrl="https://gps-tracker-nine-omega.vercel.app"
          fi
          
          echo "    static let backendBaseUrl = \"$backendUrl\"" >> "$OUT_FILE"
          
          # Pass isDebug based on Configuration prefix
          if [[ "$CONFIGURATION" == *"Debug"* ]]; then
              echo "    static let isDebug = true" >> "$OUT_FILE"
          else
              echo "    static let isDebug = false" >> "$OUT_FILE"
          fi
          
          echo "}" >> "$OUT_FILE"

      - name: Compile Kotlin KMP shared module
        script: |
          cd "$SRCROOT/.."
          if [[ "$CONFIGURATION" == *"Debug"* ]]; then
            export KOTLIN_FRAMEWORK_BUILD_TYPE="debug"
          else
            export KOTLIN_FRAMEWORK_BUILD_TYPE="release"
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    dependencies:
      # Google Sign-In and its transitive dependencies that have resource bundles
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GTMAppAuth
        product: GTMAppAuth
      - package: AppAuth
        product: AppAuth
      - package: GTMSessionFetcher
        product: GTMSessionFetcherCore
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        UILaunchScreen:
          UILaunchScreen: {}
        UIBackgroundModes:
          - location
          - fetch
          - processing
        NSLocationWhenInUseUsageDescription: Precisamos da sua localização para o rastreio da fazenda.
        NSLocationAlwaysAndWhenInUseUsageDescription: Precisamos da localização em background para enviar os pontos para a fazenda.
        NSLocationAlwaysUsageDescription: Precisamos da localização em background para enviar os pontos para a fazenda.
        NSMotionUsageDescription: Precisamos aceder aos sensores de movimento para detetar acidentes graves ou capotamento do veículo (trator).
        BGTaskSchedulerPermittedIdentifiers:
          - com.segurancarural.gpstracker.sync

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    version: 7.0.0
  GTMAppAuth:
    url: https://github.com/google/GTMAppAuth.git
    version: 2.0.0
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS.git
    version: 1.7.6
  GTMSessionFetcher:
    url: https://github.com/google/gtm-session-fetcher.git
    version: 3.5.0

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
      preActions:
        - name: Workaround SPM Custom Configuration Bundle Bug
          settingsTarget: iosApp
          script: |
            BASE_CONFIG=$(echo "$CONFIGURATION" | cut -d'-' -f1)
            if [ "$BASE_CONFIG" != "$CONFIGURATION" ]; then
              SPM_BUILD_DIR="$SYMROOT/${BASE_CONFIG}${EFFECTIVE_PLATFORM_NAME}"
              mkdir -p "$BUILT_PRODUCTS_DIR"
              BUNDLES=("AppAuth_AppAuth.bundle" "AppAuth_AppAuthCore.bundle" "GoogleSignIn_GoogleSignIn.bundle" "GTMSessionFetcher_GTMSessionFetcherCore.bundle")
              for bundle in "${BUNDLES[@]}"; do
                ln -sf "$SPM_BUILD_DIR/$bundle" "$BUILT_PRODUCTS_DIR/$bundle"
              done
            fi

