			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "cd \"$SRCROOT/..\"\nLOCAL_PROPS=\"local.properties\"\nOUT_FILE=\"iosApp/iosApp/Environment.swift\"\n\n# Write Environment.swift\necho \"import Foundation\" > \"$OUT_FILE\"\necho \"struct Environment {\" >> \"$OUT_FILE\"\n\nif [ -f \"$LOCAL_PROPS\" ]; then\n    while IFS='=' read -r key value; do\n        key=$(echo \"$key\" | tr -d '\\r')\n        value=$(echo \"$value\" | tr -d '\\r')\n        if [[ $key == \\#* ]] || [[ -z $key ]]; then continue; fi\n        \n        if [ \"$key\" == \"supabase.url\" ]; then\n            value=$(echo \"$value\" | sed 's/\\\\:/:/g')\n            echo \"    static let supabaseUrl = \\\"$value\\\"\" >> \"$OUT_FILE\"\n        elif [ \"$key\" == \"supabase.key\" ]; then\n            echo \"    static let supabaseKey = \\\"$value\\\"\" >> \"$OUT_FILE\"\n        elif [ \"$key\" == \"device.api.secret\" ]; then\n            echo \"    static let deviceApiSecret = \\\"$value\\\"\" >> \"$OUT_FILE\"\n        fi\n    done < \"$LOCAL_PROPS\"\nfi\n\n# Resolve backend URL based on configuration\nif [[ \"$CONFIGURATION\" == *\"-Dev\"* ]]; then\n    backendUrl=$(grep '^backend.base.url.dev=' \"$LOCAL_PROPS\" 2>/dev/null | cut -d'=' -f2)\n    [ -z \"$backendUrl\" ] && backendUrl=$(grep '^backend.base.url=' \"$LOCAL_PROPS\" 2>/dev/null | cut -d'=' -f2)\n    [ -z \"$backendUrl\" ] && backendUrl=\"https://gps-tracker-8q7deewac-gmlourencos-projects.vercel.app/\"\nelif [[ \"$CONFIGURATION\" == *\"-Pre\"* ]]; then\n    backendUrl=$(grep '^backend.base.url.pre=' \"$LOCAL_PROPS\" 2>/dev/null | cut -d'=' -f2)\n    [ -z \"$backendUrl\" ] && backendUrl=$(grep '^backend.base.url=' \"$LOCAL_PROPS\" 2>/dev/null | cut -d'=' -f2)\n    [ -z \"$backendUrl\" ] && backendUrl=\"https://segurancarural-gpstracker-pre.vercel.app\"\nelse\n    backendUrl=$(grep '^backend.base.url.prod=' \"$LOCAL_PROPS\" 2>/dev/null | cut -d'=' -f2)\n    [ -z \"$backendUrl\" ] && backendUrl=$(grep '^backend.base.url=' \"$LOCAL_PROPS\" 2>/dev/null | cut -d'=' -f2)\n    [ -z \"$backendUrl\" ] && backendUrl=\"https://gps-tracker-nine-omega.vercel.app\"\nfi\n\necho \"    static let backendBaseUrl = \\\"$backendUrl\\\"\" >> \"$OUT_FILE\"\n\n# Pass isDebug based on Configuration prefix\nif [[ \"$CONFIGURATION\" == *\"Debug\"* ]]; then\n    echo \"    static let isDebug = true\" >> \"$OUT_FILE\"\nelse\n    echo \"    static let isDebug = false\" >> \"$OUT_FILE\"\nfi\n\necho \"}\" >> \"$OUT_FILE\"\n";
